<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Team Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #pokemon-display img {
            width: 200px;
        }

        select {
            margin: 5px;
        }

        #team {
            margin-top: 30px;
            border-top: 2px solid black;
            padding-top: 20px;
        }

        .team-member {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h2>Pokemon Team Builder</h2>

    <input type="text" id="pokemonInput" placeholder="Name or ID">
    <button id="findBtn">Find</button>

    <div id="pokemon-display">
        <img id="pokemonImage" src="">
        <br><br>
        <audio id="pokemonAudio" controls></audio>
        <br><br>

        <select id="move1"></select>
        <select id="move2"></select>
        <select id="move3"></select>
        <select id="move4"></select>
        <br><br>

        <button id="addBtn">Add to Team</button>
    </div>

    <div id="team">
        <h3>Your Team</h3>
    </div>

<script>

const cache = {}; // caching responses
let currentPokemon = null;

document.getElementById("findBtn").addEventListener("click", fetchPokemon);
document.getElementById("addBtn").addEventListener("click", addToTeam);

async function fetchPokemon() {
    const input = document.getElementById("pokemonInput").value.toLowerCase().trim();
    if (!input) return;

    if (cache[input]) {
        console.log("Loaded from cache");
        displayPokemon(cache[input]);
        return;
    }

    try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${input}`);
        if (!response.ok) throw new Error("Pokemon not found");

        const data = await response.json();
        cache[input] = data; // store in cache
        displayPokemon(data);

    } catch (error) {
        alert("Pokemon not found!");
    }
}

function displayPokemon(data) {
    currentPokemon = data;

    // Image
    document.getElementById("pokemonImage").src =
        data.sprites.front_default;

    // Audio (Gen 5 cry works best)
    document.getElementById("pokemonAudio").src =
        `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${data.id}.ogg`;

    // Moves
    const moves = data.moves.map(m => m.move.name);

    populateDropdown("move1", moves);
    populateDropdown("move2", moves);
    populateDropdown("move3", moves);
    populateDropdown("move4", moves);
}

function populateDropdown(id, moves) {
    const dropdown = document.getElementById(id);
    dropdown.innerHTML = "";

    moves.forEach(move => {
        const option = document.createElement("option");
        option.value = move;
        option.textContent = move;
        dropdown.appendChild(option);
    });
}

function addToTeam() {
    if (!currentPokemon) return;

    const teamDiv = document.getElementById("team");

    const memberDiv = document.createElement("div");
    memberDiv.className = "team-member";

    const img = document.createElement("img");
    img.src = currentPokemon.sprites.front_default;
    img.width = 100;

    const moveList = document.createElement("ul");

    ["move1", "move2", "move3", "move4"].forEach(id => {
        const li = document.createElement("li");
        li.textContent = document.getElementById(id).value;
        moveList.appendChild(li);
    });

    memberDiv.appendChild(img);
    memberDiv.appendChild(moveList);

    teamDiv.appendChild(memberDiv);
}

</script>

</body>
</html>
